name: CI - userservice

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/accounts/userservice/**'
  push:
    branches: [main]
    paths:
      - 'src/accounts/userservice/**'
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/accounts/userservice
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.14'

      - name: Install dependencies (incl. dev group)
        run: uv sync --group dev

      - name: Static analysis (pylint)
        run: uv run pylint --fail-under=9 *.py

      - name: Unit tests with coverage gate
        run: uv run pytest --cov=. --cov-report=term-missing --cov-fail-under=90
