# .cursorrules §1.8 — ephemeral-storage for workloads with emptyDir /tmp
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      containers:
        - name: front
          resources:
            limits:
              ephemeral-storage: 0.25Gi
            requests:
              ephemeral-storage: 0.25Gi
